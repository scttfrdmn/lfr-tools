# GitHub Pages Configuration for LFR Tools
title: LFR Tools
description: AWS Lightsail for Research management for educational and research environments
theme: jekyll-theme-cayman
show_downloads: true
google_analytics: # Add your GA tracking ID if desired

# Navigation
navigation:
  - title: Home
    url: /
  - title: Getting Started
    url: /getting-started
  - title: Documentation
    url: /documentation
  - title: Tutorials
    url: /tutorials
  - title: GitHub
    url: https://github.com/scttfrdmn/lfr-tools

# Build settings
markdown: kramdown
highlighter: rouge

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Exclude from processing
exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
