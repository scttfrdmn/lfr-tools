- name: "area: aws-lightsail"
  color: "c5def5"
  description: "AWS Lightsail integration (internal/aws/lightsail.go)"

- name: "area: aws-efs"
  color: "c5def5"
  description: "AWS EFS integration (internal/aws/efs.go)"

- name: "area: aws-s3"
  color: "c5def5"
  description: "AWS S3 integration (internal/aws/s3.go)"

- name: "area: ssh"
  color: "c5def5"
  description: "SSH and connection management"

- name: "area: dcv"
  color: "c5def5"
  description: "NICE DCV remote desktop integration"

- name: "area: idle-detection"
  color: "c5def5"
  description: "Idle detection and cost optimization"

- name: "area: keychain"
  color: "c5def5"
  description: "Credential storage (keychain integration)"

- name: "area: config"
  color: "c5def5"
  description: "Configuration system (internal/config)"

- name: "area: build"
  color: "c5def5"
  description: "Build system, CI/CD, packaging, releases"

- name: "area: tests"
  color: "c5def5"
  description: "Testing infrastructure and test coverage"

- name: "area: docs"
  color: "c5def5"
  description: "Documentation (docs/, tutorials)"

# ============================================================================
# Persona Labels - Who does this help?
# ============================================================================

- name: "persona: professor"
  color: "e99695"
  description: "Benefits professors managing courses"

- name: "persona: teaching-assistant"
  color: "e99695"
  description: "Benefits teaching assistants"

- name: "persona: student"
  color: "e99695"
  description: "Benefits students using instances"

- name: "persona: researcher"
  color: "e99695"
  description: "Benefits research computing workflows"

- name: "persona: lab-manager"
  color: "e99695"
  description: "Benefits lab environment management"

- name: "persona: admin"
  color: "e99695"
  description: "Benefits system administrators"

# ============================================================================
# Status Labels - Issue lifecycle
# ============================================================================

- name: "triage"
  color: "ededed"
  description: "Needs initial review and prioritization"

- name: "needs-info"
  color: "d876e3"
  description: "Waiting for more information from reporter"

- name: "blocked"
  color: "b60205"
  description: "Blocked by external dependency or other issue"

- name: "ready"
  color: "0e8a16"
  description: "Ready to be worked on"

- name: "in-progress"
  color: "fbca04"
  description: "Currently being worked on"

- name: "in-review"
  color: "fef2c0"
  description: "In code review"

- name: "awaiting-merge"
  color: "c2e0c6"
  description: "Approved and ready to merge"

# ============================================================================
# Resolution Labels - Why was this closed?
# ============================================================================

- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or PR already exists"

- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"

- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right or is not applicable"

- name: "works-as-designed"
  color: "fef2c0"
  description: "Behavior is intentional"

# ============================================================================
# Special Labels
# ============================================================================

- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers to the project"

- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed from community"

- name: "breaking-change"
  color: "d73a4a"
  description: "Changes that break backward compatibility"

- name: "performance"
  color: "1d76db"
  description: "Performance optimization or issue"

- name: "dependencies"
  color: "0366d6"
  description: "Pull requests that update a dependency file"

- name: "needs-design"
  color: "d4c5f9"
  description: "Needs design or UX review before implementation"

- name: "question"
  color: "d876e3"
  description: "Further information is requested"

